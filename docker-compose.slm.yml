# Runs the small language model server (Ollama) on a VM or your own machine.
#   docker compose -f docker-compose.slm.yml up -d
# The model is downloaded once into the "ollama" volume by the "pull" service.
#
# SECURITY: Ollama has no login. Do not publish port 11434 to the internet as it is.
# Either bind it to localhost (below) and put the Node server on the same machine, or put a reverse proxy
# with a bearer token in front of it (see docs/SLM.md).

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"   # keep the model in RAM between requests

  pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull ${SLM_MODEL:-qwen2.5:3b}"]
    restart: "no"

volumes:
  ollama:
